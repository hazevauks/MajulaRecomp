# ReXGlue recompilation manifest for Dark Souls II (Xbox 360 disc, title 465307E4, Default.xex).
#
# Run tools/codegen.ps1: it calls `rexglue codegen ds2_manifest.toml` and the post-codegen steps. The project name sets
# the prefix of everything generated: generated/default/ds2_{init,pch,funcs}.h, ds2_recomp.N.cpp, and the CMake target
# ds2_recomp built by CMakeLists.txt.
#
# Default.xex of Scholar of the First Sin's disc 1 (tools/extract_iso.py --info, 2026-10-29): image base 0x82000000,
# entry point 0x829C3DE0, image size 0x016F0000 (24,051,712 bytes), XEX version 0.0.0.22, AES-128 "normal"
# encryption, basic compression. Until 2026-10-29 the port was built from the 2014 disc's 0.0.0.8 (tag
# ds2-2014-final); every address of app/ moved with tools/xex_addr_remap.py (docs/dlc.md).

[project]
name = "ds2"
sdk_version = "0.10.0"
# Your own game files: the extracted disc (assets/game_root, made by tools/extract_iso.py), with Default.xex at its
# root. Nothing from the game is distributed with this project.
game_root = "../assets/game_root"

[entrypoint]
file_path = "../assets/game_root/Default.xex"
out_directory_path = "generated/default"

# The includes are processed before this table, so whatever is set here overrides what is included.
#   overrides.toml       written by hand: code the automatic function discovery misses, each with its evidence
#   codegen_flavor.toml  the codegen flavour, written by tools\codegen.ps1 -Flavor: empty for "classic", a copy of
#                        perf_overrides.toml (code generation options for speed) for "optimised"
includes = ["overrides.toml", "codegen_flavor.toml"]

# No [[modules]]: the disc holds a single executable (no other .xex in the file list, 121 files). Code inside the
# GameData*.bdt archives has not been ruled out yet; see docs/ds2-notes.md.
