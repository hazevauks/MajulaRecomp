# The first validation run also reported five short backward `b` whose target is not a function entry but the shared
# `li r3,0; blr`-style exit of a frameless leaf function; the branch sits in the function's own tail, after its first
# blr (0x82617514 from 0x8261752C, 0x8281B4C4 from 0x8281B4D4, 0x828A865C from 0x828A866C, 0x828A8774 from
# 0x828A8784, 0x82CCF38C from 0x82CCF3BC). Declared by their real bounds instead, read from the listing: each starts
# right after the unconditional `b`/blr that ends the previous function, and ends where the next one begins (`mflr
# r12`, or the first instruction after the last blr that no branch of the function reaches).
