# Dark Souls II-specific analysis corrections for the code generator.
#
# Every entry needs its evidence (which tool or which log found it). The tools that produce candidates:
#   tools/find_gaps.py, tools/gap_fixpoint.py   code the automatic discovery left without a function
#   tools/pointer_scan.py                       code pointers stored in data (vtables, callback tables)
#   tools/switch_check.py                       truncated jump tables
#   tools/runtime_gap_resolver.py               "Call to invalid or unregistered function" from a game log
#
# Root keys (setjmp_address, longjmp_address, ...) must stay above the first table.

# The CRT's setjmp / longjmp (2026-10-11). With the addresses the generator emits host setjmp/longjmp keyed by the
# guest jmp_buf; recompiled as plain calls, a longjmp restores r1 from the jmp_buf and then returns to its own caller,
# which goes on with a foreign stack frame.
#   setjmp   0x82FED7E0: the only function of the program with mfcr; stores cr at 304, lr at 308, r1 at 144, 0 at 312
#            and v64-v127 (stvlx128) into the buffer, returns 0. 68 call sites.
#   longjmp  0x82FEC680: the mirror image (lfd f14-f31, ld r14-r31, lvx128, mtlr, ld r1,144, mtcr, blr). 433 call
#            sites (an error path used all over one library).
# The PGO profile of 33 minutes of play (two sessions, up to the Last Giant) has setjmp entered 3,920 times and
# every arc of longjmp at 0: no longjmp has run on the console so far.
setjmp_address = 0x82FED7E0
longjmp_address = 0x82FEC680

[functions]
# share_registers (2026-10-11, for the optimised codegen's non_volatile_as_local; no effect on the classic code): these
# functions keep r14-r31, f14-f31 and v14-v31/v64-v127 in ctx instead of C++ locals, and a caller that reaches one
# with a direct branch hands its own over and takes them back. From tools/read_before_write.py --noreturn=82FF45D0,
# 8269B380,82AE5738 (the C++ throw and the two "fatal error" printers the compiler ends functions with): 27 functions
# read one of those registers before writing it. Eight of them are real and are marked here, with the two functions
# that load the registers those read (docs/ds2-notes.md has the other 19 and why they are left alone).
#
# The WMV decoder (movie/prologue.wmv) keeps its constants in v64-v127 across C functions: sub_833C3598 stores
# v64-v127 into one buffer and loads all of them from another, sub_833C3250 does the same and loads v64-v72 back, and
# seven hand-written leaves read v64, v65, v69 or v72 without ever writing them. None of the nine calls a save/restore
# helper or writes r14-r31; the leaves use v14-v31 as scratch, as they do on the console.
"0x833C3250" = { share_registers = true }  # stvx128 v127..v64 to (r4), lvx128 v64..v72 from (r3)
"0x833C3598" = { share_registers = true }  # stvx128 v127..v64 to (r4), lvx128 v127..v64 from (r3)
"0x8317A258" = { share_registers = true }  # vor128 v14,v69,v69; vor128 v15,v72,v72
"0x8317A890" = { share_registers = true }  # the same two
"0x833DE6A8" = { share_registers = true }  # the same two
"0x833DEA50" = { share_registers = true }  # vor128 v16,v69,v69
"0x833DED10" = { share_registers = true }  # vor128 v14,v69,v69; vor128 v15,v72,v72
"0x833DEF78" = { share_registers = true }  # vor128 v1,v69,v69
"0x833E00A0" = { share_registers = true }  # vor128 v30,v64,v64; vor128 v29,v65,v65 (its first instructions)
# A ten-instruction tail of the heap function sub_829D2FC0 (reached with beq/bne from it): it reads the owner's frame
# pointer r31 (addi r12,r31,320 ... addi r1,r31,320) and leaves through the owner's __restgprlr.
# "0x829D37D4": the mark is on its own entry further down (pointer scan).

