# Dark Souls II no Switch: configuração dos primeiros testes em hardware (vai para o cartão como ds2.toml, ao lado do
# ds2.nro). Qualquer cvar do ReXGlue ou do port pode ser posto aqui. Enquanto o port estiver em teste o log fica ligado:
# é ele que diz o que aconteceu (logs/rex/ no cartão).

gpu_plugin = "xenos"
license_mask = 1

# Renderizador nativo (app/src/me) com a biblioteca de shaders ds2_shaders.mesp ao lado do .nro.
ds2_renderer_native = true
# Primeiros testes na resolução do próprio jogo nos dois modos (720p). 1080p na TV fica para depois de medir.
ds2_render_height_handheld = 720
ds2_render_height_docked = 720

# Os arquivos do jogo vão soltos na pasta game_root/ (121 arquivos, o maior com 2,8 GB): o conjunto tem 5,8 GB e um
# pacote único não cabe num cartão FAT32 (limite de 4 GB por arquivo). O SDK já recusa montar o pacote nesse caso.
asset_pack = true
asset_pack_build = false

# Tempo de GPU por categoria de passe no log (linha "GPU per Swap"), enquanto se mede onde o tempo vai.
ds2_gpu_marks_categories = true

# Log completo em arquivo durante os testes.
log_level = "info"
log_to_file = true
