# Dark Souls II on the Switch: the configuration of the hardware tests (it goes to the SD card as ds2.toml, next to
# ds2.nro). Any cvar of ReXGlue or of the port can be set here. While the port is being tested, logging stays on: the
# log is what says what happened (logs/rex/ on the card).

gpu_plugin = "xenos"
license_mask = 1

# The native renderer (app/src/me) with the shader library ds2_shaders.mesp next to the .nro.
ds2_renderer_native = true
# 2026-10-23, the first deko3d build (ds2-dk.nro): the game's own 1280x720 in handheld mode too. Renut at a reduced scale
# (540 or 480) crashed on the PC on confirming a save, not yet understood; ds2.nro and ds2-opt.nro (the PM4 renderer)
# read this too, and L3 + R3 held for a second still switches them to 540 live. 540 was 960x540, 56 % of 720p's pixels.
ds2_render_height_handheld = 720
ds2_render_height_docked = 720

# The game's files go loose in the game_root/ folder (121 files, the biggest 2.8 GB): the set is 5.8 GB and a single
# package does not fit on a FAT32 card (4 GB per file). The SDK already refuses to mount the package in that case.
asset_pack = true
asset_pack_build = false

# GPU time per pass category in the log (the "GPU per Swap" line), while measuring where the time goes.
ds2_gpu_marks_categories = true

# ZCULL for the single-sample depth target too (this game's scene): measured on the console, 137.9 -> 127.2 ms of GPU
# a frame at the first bonfire.
ds2_native_zcull_1x_depth = true

# Round 6 (2026-10-11): the format conversions of the HDR target (RGBA8 / 10-bit / 7e3, 4 to 6 a frame) as fragment
# passes instead of a compute shader. The same bits; on the console they were 14-17 ms of GPU a frame at 540p.
# To compare: configs/ds2_test_compute_conversion.toml.
ds2_native_conversion_frag = true

# 2026-10-17: the SDK's cache of file reads by exact range (from nfsmw-nx, for a game that reads the same parts of
# its archives again) only took reads of 256 KB or more. Dark Souls II reads in pieces of 128 KB and less, and half
# of what it read in a 9-minute console session (187 of 395 MB) were ranges it had already read: none was cached.
sa2_io_ranges_min_kb = 128

# A per-thread CPU report in rex_profile.log (without sampling stacks: that is configs/ds2_profile.toml).
switch_profile_report = true

# The full log to a file during the tests.
log_level = "info"
log_to_file = true

# The port's gameplay options (docs/features.md): also rows at the end of Screen Options (gear tab), which rewrite
# these two lines. Early Dull Ember: the Last Giant drops the Dull Ember and its Iron Keep pickup gives a Titanite
# Slab (live). Better fog walls: no damage while crossing a fog wall (the row only, for now).
ds2_early_dull_ember = false
ds2_fog_wall_iframes = false
# While the fog wall's crossing is investigated: the item lots the game reads and the fog wall's functions in the log.
ds2_diag_features = true
